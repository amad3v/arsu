[package]
name = "cmd"
description = "The Tauri command layer of Arsu: the IPC surface, its wire types and the app state behind it"
edition.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
crypto = { workspace = true }
interop = { workspace = true }
otp = { workspace = true }
qr = { workspace = true }
storage = { workspace = true }
vault-core = { workspace = true }

rustix = { workspace = true, features = ["fs", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true }
gtk = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
biometric = { workspace = true }
jni = { workspace = true }
ndk-context = { workspace = true }
tauri-plugin-dialog = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
