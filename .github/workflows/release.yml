name: Release

# Builds every release artifact: the Linux binary, its .deb and .rpm, and
# the signed Android APK. Then, when publishing, the GitHub release with
# its notes from CHANGELOG.md and a SHA256SUMS file.
#
# - Pushing a version tag (the usual way: a GPG-signed tag, which the AUR
#   `arsu` package requires) builds and publishes that release.
# - Running it by hand builds the artifacts for the commit it runs on; with
#   `publish`, it also publishes the release, creating the tag at that
#   commit if it doesn't exist (an unsigned tag, which the AUR `arsu`
#   package cannot build from).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.1.0 (must match the version in Cargo.toml)'
        required: true
      publish:
        description: 'Publish the release (creating the tag if needed)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Exact: F-Droid's build installs this same version (its recipe pins it).
  NODE_VERSION: '26.10.0'
  # The NDK and Java the Android build is made with, as locally.
  NDK_VERSION: '28.2.13676358'
  JAVA_VERSION: '21'

# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment) so a moved tag cannot change what runs here.
jobs:
  prepare:
    name: Check the version and notes
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the app's version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::'$TAG' is not a version tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          node_version=$(jq -r .version package.json)
          if ! [[ "$cargo_version" == "$version" && "$node_version" == "$version" ]]; then
            echo "::error::$TAG does not match Cargo.toml ($cargo_version) and package.json ($node_version)"
            exit 1
          fi
          # The Android version code is written out, for F-Droid to read,
          # and must be the one Tauri would derive from the version.
          IFS=. read -r major minor patch <<< "$version"
          expected_code=$((major * 1000000 + minor * 1000 + patch))
          version_code=$(jq -r .bundle.android.versionCode src-tauri/tauri.android.conf.json)
          if [[ "$version_code" != "$expected_code" ]]; then
            echo "::error::versionCode in src-tauri/tauri.android.conf.json is $version_code, not $expected_code"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
      - name: Write the release notes
        # The version's section of CHANGELOG.md, then how to check and
        # install the downloads (.github/release-install.md).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            .github/scripts/release-notes.sh "$VERSION"
            echo
            envsubst "\$VERSION" < .github/release-install.md
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  linux:
    name: Linux (binary, deb, rpm)
    needs: prepare
    # The oldest supported runner: the binary then runs on the widest range
    # of glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system libraries
        # https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build --bundles deb,rpm -- --locked
      - name: Collect the artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Tauri names the bundles after the product (Arsu_…); the release
          # names them after the package (arsu_…), as before.
          mkdir out
          cp target/release/arsu out/arsu
          cp "target/release/bundle/deb/Arsu_${VERSION}_amd64.deb" "out/arsu_${VERSION}_amd64.deb"
          cp "target/release/bundle/rpm/Arsu-${VERSION}-1.x86_64.rpm" "out/arsu-${VERSION}-1.x86_64.rpm"
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  android:
    name: Android (signed APK)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-android
      - name: Set up the release signing key
        # Without the key, a build to publish fails rather than shipping an
        # APK signed with a throwaway debug key, which phones would refuse
        # to update from the real one.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::The ANDROID_KEYSTORE_* secrets are not set: the APK cannot be signed for release"
              exit 1
            fi
            echo "::warning::No release key: this APK is signed with a debug key, for testing only"
            exit 0
          fi
          umask 077
          keystore="$RUNNER_TEMP/arsu-release.jks"
          base64 --decode <<< "$KEYSTORE_BASE64" > "$keystore"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - name: Build
        run: pnpm tauri android build --apk -- --locked
      - name: Check the signature, and collect the APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          # The release certificate's SHA-256, as `apksigner` prints it: if
          # set, an APK signed with any other key fails the build.
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if [[ -n "$EXPECTED_CERT_SHA256" ]] && ! grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" <<< "$certs"; then
            echo "::error::The APK is not signed with the release certificate"
            exit 1
          fi
          mkdir out
          cp "$apk" "out/arsu-$VERSION.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: out/*
          if-no-files-found: error

  android-reproducible:
    name: Android (rebuild and compare)
    # F-Droid builds each release from source and publishes our APK only if
    # its own build is identical apart from the signature. This makes a
    # second, independent build (another directory, Cargo and rustup homes,
    # no cache) and compares it with the APK above, so that a release that
    # F-Droid could not reproduce is never published.
    needs: [prepare, android]
    runs-on: ubuntu-24.04
    env:
      SRC: io.github.amad3v.arsu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.SRC }}
      - name: Use separate Cargo and rustup homes
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup"
          } >> "$GITHUB_ENV"
          # rustup, and its proxies, must live in the Cargo home.
          bin=$RUNNER_TEMP/cargo/bin
          mkdir -p "$bin"
          cp "$(command -v rustup)" "$bin/"
          for proxy in cargo rustc rustdoc; do ln -s rustup "$bin/$proxy"; done
          echo "$bin" >> "$GITHUB_PATH"
      # The path is SRC's: `uses` cannot read the environment.
      - uses: ./io.github.amad3v.arsu/.github/actions/android-toolchain
        with:
          path: ${{ env.SRC }}
      - name: Build
        working-directory: ${{ env.SRC }}
        run: pnpm tauri android build --apk -- --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android
          path: published
      - name: Compare, ignoring the signatures
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rebuilt=$SRC/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          mkdir rebuilt && cp "$rebuilt" "rebuilt/arsu-$VERSION.apk"
          PATH=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1):$PATH
          if ! pipx run apksigcopier==1.1.1 compare "published/arsu-$VERSION.apk" "rebuilt/arsu-$VERSION.apk"; then
            echo "::error::The APK is not reproducible: these entries differ"
            "$SRC/.github/scripts/apk-diff.py" "published/arsu-$VERSION.apk" "rebuilt/arsu-$VERSION.apk"
            exit 1
          fi
          echo "The rebuilt APK is identical to the published one, apart from the signature"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-rebuilt
          path: rebuilt/*

  release:
    name: Publish the release
    needs: [prepare, linux, android, android-reproducible]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          cp artifacts/linux/* artifacts/android/* dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            # An existing tag must point at the commit these were built from.
            if [[ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG exists and points at another commit than the one built"
              exit 1
            fi
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${target[@]}" \
            --title "Arsu $VERSION" \
            --notes-file artifacts/notes/notes.md \
            dist/*
