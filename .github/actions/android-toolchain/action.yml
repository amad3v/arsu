name: Android toolchain
description: >
  Installs what the Android build is made with (Java, the NDK, the pinned
  Rust toolchain with the Android targets, Node and pnpm) and the frontend's
  dependencies, for the checkout in `path`.

inputs:
  path:
    description: The checkout to set up, relative to the workspace
    default: .

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - name: Install the Android NDK
      shell: bash
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
    - name: Install the pinned Rust toolchain and the Android targets
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        rustup toolchain install
        rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    # Installs the pnpm version pinned by `packageManager` in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.path }}/package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.path }}/pnpm-lock.yaml
    - shell: bash
      working-directory: ${{ inputs.path }}
      run: pnpm install --frozen-lockfile
